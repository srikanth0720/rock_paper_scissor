<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Rock Paper Scissor</h1>
  <div class="choises">
    <div class="choise" id="rock">
      <img src="https://uploads.onecompiler.io/454z3mnkm/4574chwcw/rock.png">
    </div>
    <div class="choise" id="paper">
    <img src="https://uploads.onecompiler.io/454z3mnkm/4574chwcw/paper.png">
    </div>
    <div class="choise" id="scissor">
    <img src="https://uploads.onecompiler.io/454z3mnkm/4574chwcw/scissors.png">
    </div>
  </div>
  <div class="score-board">
    <div class="score">
      <p id="user">0</p>
      <p>Yours</p>
    </div>
        <div class="score">
      <p id="comp">0</p>
      <p>computer</p>
    </div>
  </div>
  <div class="msg-container">
    <p id="msg">Play your Move</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
